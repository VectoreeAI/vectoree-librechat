# GitLab CI：MR 只测试；push dev 部署测试环境；push main 先备份再部署生产，并把 main 推到 GitHub。
#
# 镜像（GitLab Container Registry）：
#   ${CI_REGISTRY_IMAGE}/api:dev|latest
#
# 服务器上是独立的 compose 项目 /opt/vectoree-librechat，只 pull 镜像，不在机器上构建。
# 配置以服务器上的 .env 为准。CI 每次只覆盖 LIBRECHAT_IMAGE、VECTOREE_API_URL 和 DEPLOY_MODE=cloud。
#
# SSH 变量和 vectoree-starter 用同一套，建议配在 GitLab Group 上：
#   测试：DEV_DEPLOY_HOST、DEV_DEPLOY_USER、DEV_DEPLOY_SSH_KEY、DEV_DEPLOY_PORT
#   生产：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY、DEPLOY_PORT
# 私钥变量是一行 base64（无空白）：base64 < ~/.ssh/你的私钥 | tr -d '\n'
# 部署目录默认 /opt/vectoree-librechat，可用 DEV_DEPLOY_PATH / DEPLOY_PATH 覆盖。
#
# GitHub 仓库：https://github.com/VectoreeAI/vectoree-librechat.git
# 需要 CI 变量 GITHUB_TOKEN（Masked、Protected，环境范围 All）。
# 备份推送需要允许本仓库的 CI_JOB_TOKEN 推送到 main-backup。
# CI_JOB_TOKEN 与 GITHUB_TOKEN 都直接写进远程地址，和 vectoree-starter 一样。

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags: [docker]
  interruptible: true

variables:
  DOCKER_BUILDKIT: "1"
  LIBRECHAT_IMAGE: ${CI_REGISTRY_IMAGE}/api:latest
  LIBRECHAT_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}

stages:
  - .pre
  - check
  - deploy
  - publish

# 合并进 main 之后，流水线第一步把合并前的 main 合并进 main-backup。
# CI_COMMIT_BEFORE_SHA 是这次推送之前的 main。备份成功后才推 GitHub。
backup_main:
  stage: .pre
  image: alpine:3.21
  interruptible: false
  resource_group: librechat-main-backup
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - |
      set -euo pipefail
      before="${CI_COMMIT_BEFORE_SHA:-}"
      empty="0000000000000000000000000000000000000000"
      if [ -z "$before" ] || [ "$before" = "$empty" ]; then
        echo "No previous main commit to back up."
        exit 0
      fi
      git config user.email "${GITLAB_USER_EMAIL:-ci@vectoree.space}"
      git config user.name "${GITLAB_USER_NAME:-GitLab CI}"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch origin "$before"
      if git fetch origin refs/heads/main-backup; then
        git checkout -B main-backup FETCH_HEAD
        git merge --no-edit --allow-unrelated-histories "$before" -m 'chore: backup main before release'
      else
        git checkout -B main-backup "$before"
      fi
      git push origin HEAD:refs/heads/main-backup
      echo "main-backup updated from ${before}"

test:
  stage: check
  image: node:24.16.0-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates git >/dev/null
  script:
    - node --test config/gitlab-ci.contract.test.mjs
  timeout: 10m

.deploy:
  stage: deploy
  image: docker:27
  timeout: 90m
  interruptible: false
  needs:
    - test
  before_script:
    - unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_TLS_CERTDIR || true
    - apk add --no-cache bash openssh-client
    - |
      set -euo pipefail
      if [[ "${CI_JOB_NAME:-}" == "deploy_development" ]]; then
        export DEPLOY_HOST="${DEV_DEPLOY_HOST:-}"
        export DEPLOY_USER="${DEV_DEPLOY_USER:-}"
        export DEPLOY_SSH_KEY="${DEV_DEPLOY_SSH_KEY:-}"
        export DEPLOY_PORT="${DEV_DEPLOY_PORT:-22}"
        export DEPLOY_PATH="${DEV_DEPLOY_PATH:-/opt/vectoree-librechat}"
        export DEPLOY_API_BASE_URL="${DEV_DEPLOY_API_BASE_URL:-https://vectoree.net}"
      else
        export DEPLOY_HOST="${DEPLOY_HOST:-}"
        export DEPLOY_USER="${DEPLOY_USER:-}"
        export DEPLOY_SSH_KEY="${DEPLOY_SSH_KEY:-}"
        export DEPLOY_PORT="${DEPLOY_PORT:-22}"
        export DEPLOY_PATH="${DEPLOY_PATH:-/opt/vectoree-librechat}"
        export DEPLOY_API_BASE_URL="${DEPLOY_API_BASE_URL:-https://vectoree.ai}"
      fi
      echo "deploy job=${CI_JOB_NAME:-} branch=${CI_COMMIT_BRANCH:-} host=${DEPLOY_HOST:-} path=${DEPLOY_PATH}"
    - test -n "${DEPLOY_HOST:-}" || (echo "Set DEPLOY_HOST (dev 用 DEV_DEPLOY_HOST)" && exit 1)
    - test -n "${DEPLOY_USER:-}" || (echo "Set DEPLOY_USER (dev 用 DEV_DEPLOY_USER)" && exit 1)
    - test -n "${DEPLOY_SSH_KEY:-}" || (echo "Set DEPLOY_SSH_KEY (dev 用 DEV_DEPLOY_SSH_KEY)" && exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -euo pipefail
      echo "=== Build ${LIBRECHAT_IMAGE} ==="
      docker build -f Dockerfile \
        --build-arg BUILD_COMMIT="$CI_COMMIT_SHA" \
        --build-arg BUILD_BRANCH="$CI_COMMIT_BRANCH" \
        --build-arg BUILD_DATE="$CI_COMMIT_TIMESTAMP" \
        -t "$LIBRECHAT_IMAGE" \
        -t "$LIBRECHAT_IMAGE_SHA" .
      docker push "$LIBRECHAT_IMAGE"
      docker push "$LIBRECHAT_IMAGE_SHA"
    - |
      set -euo pipefail
      SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o Port=${DEPLOY_PORT}"
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      SSH="ssh $SSH_OPTS -i ~/.ssh/id_ed25519"
      SCP="scp $SSH_OPTS -i ~/.ssh/id_ed25519"

      PULL_REGISTRY_USER="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}"
      PULL_REGISTRY_PASSWORD="${REGISTRY_PULL_TOKEN:-$CI_REGISTRY_PASSWORD}"

      $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}/deploy'"
      $SCP docker-compose.deploy.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.deploy.yml"
      $SCP deploy/deploy-remote.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/deploy/deploy-remote.sh"
      $SCP deploy/env.example "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/deploy/env.example"
      $SCP librechat.example.yaml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/librechat.example.yaml"

      $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "DEPLOY_PATH='${DEPLOY_PATH}' LIBRECHAT_IMAGE='${LIBRECHAT_IMAGE}' CI_REGISTRY='${CI_REGISTRY}' CI_REGISTRY_USER='${PULL_REGISTRY_USER}' CI_REGISTRY_PASSWORD='${PULL_REGISTRY_PASSWORD}' DEPLOY_API_BASE_URL='${DEPLOY_API_BASE_URL}' bash -s" <<'REMOTE'
      set -euo pipefail
      cd "$DEPLOY_PATH"
      chmod +x deploy/deploy-remote.sh

      echo "=== Login GitLab Container Registry ==="
      echo "$CI_REGISTRY_PASSWORD" | sudo docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "=== Disk space ==="
      df -h
      sudo docker system prune -f || true

      echo "=== Pull images / deploy ==="
      export LIBRECHAT_IMAGE VECTOREE_API_URL="$DEPLOY_API_BASE_URL" DEPLOY_MODE=cloud
      sudo -E bash "$DEPLOY_PATH/deploy/deploy-remote.sh"
      echo "=== Done ==="
      REMOTE

deploy_development:
  extends: .deploy
  resource_group: librechat-development-deploy
  environment:
    name: dev
    url: https://vectoree.net
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    LIBRECHAT_IMAGE: ${CI_REGISTRY_IMAGE}/api:dev
    LIBRECHAT_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/api:dev-${CI_COMMIT_SHA}

deploy_production:
  extends: .deploy
  needs:
    - test
    - backup_main
  resource_group: librechat-production-deploy
  environment:
    name: production
    url: https://vectoree.ai
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# dev 合并进 main 后，把 GitLab main 推到 GitHub main。
# 没有共同历史时，用一次 --force-with-lease 替换 GitHub 上的旧提交。
# 已经有共同历史但 GitHub 超前时，拒绝覆盖。
# GITHUB_TOKEN 直接放进请求地址，和 vectoree-starter 的 publish_github 一样。
publish_github:
  stage: publish
  image: alpine:3.21
  interruptible: false
  needs:
    - test
    - backup_main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - |
      set -euo pipefail
      test -n "${GITHUB_TOKEN:-}" || (echo "Set GITHUB_TOKEN in GitLab CI/CD variables (Masked, Protected, environment All)." && exit 1)
      secret_pattern='BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_|github_pat_|glpat-|AKIA[0-9A-Z]{16}|(^|[^A-Za-z0-9_])(TOKEN|PASSWORD|SECRET)=[^[:space:]]'
      if printf '' | grep -E -q "$secret_pattern"; then
        :
      else
        status="$?"
        if [ "$status" -eq 2 ]; then
          echo "Secret pattern is invalid."
          exit 1
        fi
      fi
      secret_sha=""
      git log --format='%H' > /tmp/gitlab-main-shas
      while IFS= read -r sha; do
        [ -n "$sha" ] || continue
        body="$(git log -1 --format='%B' "$sha")"
        if printf '%s\n' "$body" | grep -E -q "$secret_pattern"; then
          secret_sha="$sha"
          break
        fi
      done < /tmp/gitlab-main-shas
      rm -f /tmp/gitlab-main-shas
      if [ -n "$secret_sha" ]; then
        printf '%s commit message matched a secret pattern\n' "$secret_sha"
        exit 1
      fi
      github_url="https://x-access-token:${GITHUB_TOKEN}@github.com/VectoreeAI/vectoree-librechat.git"
      git fetch "$github_url" refs/heads/main
      if git merge-base --is-ancestor FETCH_HEAD HEAD; then
        git push "$github_url" "HEAD:refs/heads/main"
        echo "GitHub main updated"
      elif git merge-base FETCH_HEAD HEAD >/dev/null 2>&1; then
        echo "GitHub main has diverged from GitLab main. Refusing to overwrite."
        exit 1
      else
        remote_sha="$(git rev-parse FETCH_HEAD)"
        echo "GitHub main has no common history. Replacing ${remote_sha} once."
        git push --force-with-lease="refs/heads/main:${remote_sha}" "$github_url" "HEAD:refs/heads/main"
        echo "GitHub main replaced"
      fi
