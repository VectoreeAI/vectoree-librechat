# 服务器上拉镜像启动，不在机器上构建。
#   docker compose -f docker-compose.deploy.yml up -d

name: vectoree-librechat

services:
  api:
    image: ${LIBRECHAT_IMAGE:?set LIBRECHAT_IMAGE}
    container_name: vectoree-librechat-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      VECTOREE_API_URL: ${VECTOREE_API_URL:-https://vectoree.ai}
      DEPLOY_MODE: ${DEPLOY_MODE:-cloud}
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-5175}:3080"
    volumes:
      - ./.env:/app/.env:ro
      - ./librechat.example.yaml:/app/librechat.yaml:ro
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  mongodb:
    image: mongo:8.0.20
    container_name: vectoree-librechat-mongodb
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  librechat-data:
  librechat-uploads:
  librechat-images:
  librechat-logs:
